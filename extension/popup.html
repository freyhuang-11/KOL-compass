<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 320px; margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; color: #0f172a; }
      header { background: #2563eb; color: #fff; padding: 12px 14px; font-weight: 600; font-size: 14px; }
      .body { padding: 14px; }
      .row { margin-bottom: 12px; }
      label { display: block; font-size: 12px; color: #475569; margin-bottom: 4px; }
      input[type="text"] { width: 100%; box-sizing: border-box; padding: 7px 8px; border: 1px solid #e2e8f0; border-radius: 7px; font-size: 13px; }
      .creator { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; font-size: 13px; }
      .creator b { font-size: 14px; }
      .muted { color: #94a3b8; font-size: 12px; }
      .btn { width: 100%; background: #2563eb; color: #fff; border: 0; border-radius: 8px; padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer; }
      .btn:disabled { background: #94a3b8; cursor: default; }
      .status { margin-top: 10px; font-size: 12px; min-height: 16px; }
      .ok { color: #16a34a; } .err { color: #dc2626; }
      .toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #475569; }
      .tags span { display: inline-block; background: #eef2ff; color: #4338ca; border-radius: 5px; padding: 1px 6px; font-size: 11px; margin: 2px 2px 0 0; }
      .ckhead { font-size: 14px; margin-bottom: 8px; }
      .verdict { text-align: center; font-weight: 700; font-size: 15px; padding: 8px; border-radius: 8px; margin-bottom: 10px; }
      .lights { display: flex; flex-direction: column; gap: 5px; }
      .light-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
      .light-row span { color: #475569; }
      .detail { margin-top: 8px; font-size: 12px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <header>KOL Compass · 建联前采集器</header>
    <div class="body">
      <div class="row" id="creatorBox">
        <label>当前达人</label>
        <div class="creator" id="creator"><span class="muted">请打开一个 TikTok 达人主页（tiktok.com/@用户名）</span></div>
      </div>
      <div class="status" id="status"></div>
      <div class="row toggle">
        <input type="checkbox" id="autoCapture" checked />
        <label for="autoCapture" style="margin:0">浏览达人页时自动体检并回流 Compass（限速 60 秒/人）</label>
      </div>
      <div class="row">
        <label>Compass 后端地址</label>
        <input type="text" id="compassUrl" placeholder="http://127.0.0.1:8015" />
      </div>
      <div class="muted" id="lastIngest"></div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
